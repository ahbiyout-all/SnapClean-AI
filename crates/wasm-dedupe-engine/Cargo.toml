[package]
name = "wasm-dedupe-engine"
version = "1.0.0"
edition = "2021"
authors = ["SnapClean AI Team"]
description = "High-performance WebAssembly engine for SnapClean AI Funnel & Dedupe algorithms"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }
imagehasher = "1.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
