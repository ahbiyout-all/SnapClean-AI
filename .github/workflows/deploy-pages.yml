name: 'SnapClean AI - GitHub Pages Automated Deployment'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Synchronize Version
        run: node scripts/version-manager.js sync

      - name: Build Web Application (Vite Static Bundle)
        run: npx vite build

      - name: Generate Mobile Artifacts in dist/
        run: node scripts/build-mobile.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
